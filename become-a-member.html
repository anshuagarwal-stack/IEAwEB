<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Send a membership enquiry to International English Academy India."
  >
  <title>Become a Member | IEA Clubs</title>
  <link rel="icon" href="assets/images/iea-logo.png">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/global.css?v=guest-attendance-1">
  <link rel="stylesheet" href="assets/css/public.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="public-page" data-page="membership">
  <a class="skip-link" href="#mainContent">Skip to membership enquiry</a>
  <header id="siteHeader"></header>

  <main id="mainContent">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">IEA Clubs Membership</p>
        <h1>Become a Member</h1>
        <p class="lead">
          Send your details and the IEA team will contact you about joining Film Club,
          Reading Club and Awareness Club.
        </p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form id="membershipEnquiryForm" class="card enquiry-card">
          <div class="enquiry-form-grid">
            <label class="form-field">
              <span class="form-label">Full name *</span>
              <input
                id="enquiryName"
                class="form-input"
                type="text"
                maxlength="120"
                autocomplete="name"
                required
              >
            </label>

            <label class="form-field">
              <span class="form-label">Phone number *</span>
              <input
                id="enquiryPhone"
                class="form-input"
                type="tel"
                inputmode="tel"
                maxlength="15"
                autocomplete="tel"
                required
              >
            </label>

            <label class="form-field">
              <span class="form-label">WhatsApp number</span>
              <input
                id="enquiryWhatsApp"
                class="form-input"
                type="tel"
                inputmode="tel"
                maxlength="15"
                autocomplete="tel"
                placeholder="Leave blank if it is the same as your phone number"
              >
            </label>

            <label class="form-field">
              <span class="form-label">Email</span>
              <input
                id="enquiryEmail"
                class="form-input"
                type="email"
                maxlength="200"
                autocomplete="email"
              >
            </label>

            <label class="form-field">
              <span class="form-label">City</span>
              <input
                id="enquiryCity"
                class="form-input"
                type="text"
                maxlength="100"
                autocomplete="address-level2"
              >
            </label>

            <label class="form-field">
              <span class="form-label">Preferred plan</span>
              <select id="enquiryPlan" class="form-input">
                <option value="">Not decided yet</option>
              </select>
            </label>
          </div>

          <label class="form-field">
            <span class="form-label">Message</span>
            <textarea
              id="enquiryMessage"
              class="form-input"
              rows="5"
              maxlength="1000"
              placeholder="Tell us anything relevant about your membership enquiry."
            ></textarea>
          </label>

          <label class="enquiry-honeypot" aria-hidden="true">
            Website
            <input
              id="enquiryWebsite"
              type="text"
              tabindex="-1"
              autocomplete="off"
            >
          </label>

          <div class="enquiry-submit-row">
            <button
              id="enquirySubmitButton"
              class="button button-dark"
              type="submit"
            >Send Enquiry</button>

            <a class="button button-secondary" href="membership.html">
              Back to Plans
            </a>
          </div>

          <p
            id="enquiryFormMessage"
            class="form-message"
            aria-live="polite"
          ></p>
        </form>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js?v=member-form-20260729"></script>
  <script src="assets/js/auth.js?v=data-fix-20260729-2"></script>
  <script src="assets/js/navigation.js?v=guest-attendance-1"></script>
  <script src="assets/js/enquiry.js?v=member-form-20260729"></script>
</body>
</html>
